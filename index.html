<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Roue des Questions</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

@keyframes blink {
    0%   { background-color: rgb(204,60,60); }
    50%  { background-color: #fff; }
    100% { background-color: rgb(204,60,60); }
}
@keyframes shadowBlink {
    0%   { box-shadow: 0 0 0 5px #333, 0 0 0 15px rgb(204,60,60), 0 0 0 18px #111; }
    50%  { box-shadow: 0 0 0 5px #333, 0 0 0 15px #fff,            0 0 0 18px #111; }
    100% { box-shadow: 0 0 0 5px #333, 0 0 0 15px rgb(204,60,60), 0 0 0 18px #111; }
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-width: 100vw;
    background: #2a2a2a;
    padding: 40px 20px;
    transition: background 0.6s ease;
}

.page-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    width: 100%;
    max-width: 620px;
}

.container {
    position: relative;
    --wheel-size: clamp(240px, 55vw, 420px);
    width: var(--wheel-size);
    height: var(--wheel-size);
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container .spinBtn {
    position: absolute;
    width: 56px; height: 56px;
    background: rgba(10,10,10,0.85);
    border-radius: 50%;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    text-transform: uppercase;
    font-weight: 700;
    font-size: 0.62em;
    color: #e0e0e0;
    letter-spacing: 0.08em;
    border: 3px solid rgba(255,255,255,0.12);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease;
}
.container .spinBtn:hover { transform: scale(1.09); }

.container .spinBtn::before {
    content: '';
    position: absolute;
    top: -26px;
    width: 18px; height: 32px;
    background: #fff;
    clip-path: polygon(50% 0, 0 100%, 100% 100%);
}

.blinking::before { animation: blink 0.5s infinite; }
.blinking         { animation: blink 0.5s infinite; }

.container .wheel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #333;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 5px #333,
                0 0 0 15px #fff,
                0 0 0 18px #111,
                0 8px 40px rgba(0,0,0,0.4);
    transition: transform 5s ease-in-out;
}

.blinkaaa { animation: shadowBlink 0.5s infinite; }

.container .wheel .number {
    position: absolute;
    width: 50%; height: 50%;
    background: var(--clr);
    transform-origin: bottom right;
    transform: rotate(calc(30deg * var(--i)));
    clip-path: polygon(0 0, 45% 0, 100% 100%, 0 39%);
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    cursor: pointer;
}

.container .wheel .number span {
    position: relative;
    transform: rotate(45deg);
    font-size: clamp(0.85em, 2.5vw, 1.4em);
    font-weight: 700;
    color: rgba(20,18,18,0.85);
    text-shadow: 1px 1px 2px rgba(255,255,255,0.35);
    white-space: nowrap;
}

.question-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
}

.theme-label {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.35);
}

#selected-theme {
    display: block;
    font-size: clamp(2.8rem, 7vw, 4.2rem);
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -0.02em;
}

.divider {
    width: 44px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
}

#question-display {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    line-height: 1.75;
    color: rgba(255,255,255,0.82);
    max-width: 520px;
}
#question-display p      { animation: fadeInUp 0.4s ease; }
#question-display strong { font-weight: 600; color: #fff; }

.hint {
    font-size: 1rem;
    color: rgba(255,255,255,0.22);
    font-style: italic;
}

/* Notation */
#rating-container {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: fadeInUp 0.4s ease;
}
#rating-container.visible { display: flex; }

.rating-label {
    font-size: 0.82rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.35);
}

#stars { display: flex; gap: 6px; }

.star {
    font-size: clamp(1.6rem, 5vw, 2rem);
    color: rgba(255,255,255,0.25);
    cursor: pointer;
    transition: color 0.15s ease, transform 0.15s ease;
    line-height: 1;
    user-select: none;
}
.star:hover { color: #ffd966; transform: scale(1.18); }
.star.lit   { color: #ffd966; }

#avg-rating {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.38);
    font-style: italic;
    min-height: 1.2em;
}

/* Nav buttons */
#nav-buttons {
    display: none;
    flex-direction: row;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeInUp 0.4s ease;
}
#nav-buttons.visible { display: flex; }

#nav-buttons button {
    padding: 9px 22px;
    border-radius: 24px;
    border: 2px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    font-family: 'Poppins', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease,
                border-color 0.2s ease, transform 0.15s ease;
    backdrop-filter: blur(4px);
}
#nav-buttons button:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.4);
    color: #fff;
    transform: translateY(-2px);
}
#nav-buttons button:active { transform: translateY(0); }

#btn-back.hidden {
    opacity: 0;
    pointer-events: none;
}
    </style>
</head>

t-ce qui est le plus difficile dans le fait de vivre à l'étranger ?","Pour les bi-nationaux comment vous sentez vous par rapport à vos terres natals, integres par les deux, rejetés par les deux, …","Quelle est la leçon que vous retiendrez de votre conversation avec les autres ?","Pensez-vous que le pays dans lequel vous vivez est celui qui vous convient le mieux ?"],

            "Travail": ["Quel est ton pire souvenir au travail ?","Si tu pouvais changer de métier demain, tu ferais quoi ?","Qu'est-ce qui te motive vraiment dans ton travail ?","As-tu déjà pris un congé maladie sans vraiment être malade ?","Quel collègue t'a le plus marqué·e, en bien ou en mal ?"],
            "Malaises": ["Quelle est la situation la plus gênante que tu aies vécue ?","As-tu déjà envoyé un message à la mauvaise personne ?","Quel est le mensonge dont tu as le plus honte ?","As-tu déjà fait semblant de ne pas voir quelqu'un pour l'éviter ?","Quelle est la chose la plus embarrassante que tu aies faite en public ?"],
            "Croyances": ["Crois-tu en la vie après la mort ?","Quelle est ta superstition la plus irrationnelle ?","As-tu déjà eu un signe qui t'a semblé venir d'ailleurs ?","En quoi crois-tu vraiment, même si c'est difficile à expliquer ?","Pensez-vous que des extraterrestres puissent exister ?"],
            "Conflits": ["Quelle est la dispute dont tu es le plus fier·e d'être sorti·e ?","As-tu déjà coupé les ponts avec quelqu'un ? Pourquoi ?","Comment réagis-tu quand quelqu'un te blesse ?","Si tu pouvais avoir le dernier mot dans un conflit passé, que dirais-tu ?","Qu'est-ce qui te met vraiment en colère ?"],
            "Expériences": ["Si tu pouvais voyager dans le temps pour assister à UN événement passé, ce serait quoi ?","Quel est l'endroit où tu t'es senti·e le plus à l'aise et détendu·e ?","Si tu pouvais voir n'importe quel·le artiste en concert, mort ou vivant, qui choisirais-tu ?","Vous considérez-vous comme un preneur de risques ?","Avez-vous déjà vécu une expérience de mort imminente ?"],
            "Loisirs": ["Qu'est-ce qui constituerait une journée parfaite pour vous ?","C'est quoi ton gros mot préféré ?","Qu'est-ce que vous regardez/écoutez/lisez en boucle ces derniers temps ?","Si tu ne pouvais plus regarder qu'un seul film, ce serait lequel ?","Quelle émission télé nulle pourrais-tu regarder pendant des heures ?"]

  const wheel = document.querySelector('.wheel');
  const spinBtn = document.querySelector('.spinBtn');
  const hint = document.querySelector('.hint');
  let value = Math.ceil(Math.random() * 3600);

  let currentTheme = null;
  let currentQuestions = [];
  let currentQuestion = null;
  let previousQuestion = null;

  const ratingEl = document.getElementById('rating-container');
  const navEl = document.getElementById('nav-buttons');
  const btnBack = document.getElementById('btn-back');

  function showUI() { 
    ratingEl.classList.add('visible'); 
    navEl.classList.add('visible'); 
  }

  function hideUI() { 
    ratingEl.classList.remove('visible'); 
    navEl.classList.remove('visible'); 
  }

  function showBack() { 
    btnBack.classList.remove('hidden'); 
  }

  function hideBack() { 
    btnBack.classList.add('hidden'); 
  }

  function getTodayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function getAskedQuestions() {
    const todayKey = getTodayKey();
    const stored = JSON.parse(localStorage.getItem('askedQuestions') || '{}');
    if (stored.date !== todayKey) return { date: todayKey, questions: [] };
    return stored;
  }

  function saveAskedQuestion(q) {
    const data = getAskedQuestions();
    if (!data.questions.includes(q)) data.questions.push(q);
    localStorage.setItem('askedQuestions', JSON.stringify(data));
  }

  async function saveRating(q, note) {
    try {
      const ref = doc(db, "questions", btoa(q));
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        await setDoc(ref, { sum: note, count: 1, asked: 0 });
      } else {
        const data = snap.data();
        await updateDoc(ref, {
          sum: data.sum + note,
          count: data.count + 1
        });
      }
    } catch (e) {
      console.error("Erreur sauvegarde:", e);
    }
  }

  async function getQuestionData(q) {
    try {
      const ref = doc(db, "questions", btoa(q));
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        return { avg: 3, count: 0, asked: 0 };
      }

      const data = snap.data();
      return {
        avg: data.count > 0 ? data.sum / data.count : 3,
        count: data.count || 0,
        asked: data.asked || 0
      };
    } catch (e) {
      console.error("Erreur lecture:", e);
      return { avg: 3, count: 0, asked: 0 };
    }
  }

  async function markQuestionAsked(q) {
    try {
      const ref = doc(db, "questions", btoa(q));
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        await setDoc(ref, { sum: 0, count: 0, asked: 1 });
      } else {
        const data = snap.data();
        await updateDoc(ref, {
          asked: (data.asked || 0) + 1
        });
      }
    } catch (e) {
      console.error("Erreur marquage:", e);
    }
  }

  async function weightedRandom(questions) {
    let weights = [];

    for (let q of questions) {
      const data = await getQuestionData(q);
      const avg = data.avg;
      const count = data.count;
      const asked = data.asked;

      const popularity = Math.log(1 + count);
      const freshness = 1 / (1 + asked);
      const weight = Math.max(0.3, avg * (1 + popularity) * (1 + freshness));

      weights.push(weight);
    }

    const total = weights.reduce((a, b) => a + b, 0);
    let rand = Math.random() * total;

    for (let i = 0; i < questions.length; i++) {
      rand -= weights[i];
      if (rand <= 0) return questions[i];
    }

    return questions[questions.length - 1];
  }

  async function getAvailableQuestion(questions) {
    const asked = getAskedQuestions().questions;
    const available = questions.filter(q => !asked.includes(q));
    if (available.length === 0) return null;
    return await weightedRandom(available);
  }

  async function renderStars(q) {
    const data = await getQuestionData(q);
    const avg = data.avg;
    const stars = document.querySelectorAll('.star');
    const filled = (avg !== null && avg !== undefined) ? Math.round(avg) : 0;

    stars.forEach((s, i) => {
      s.textContent = (i < filled) ? '\u2605' : '\u2606';
      s.classList.toggle('lit', i < filled);

      s.onclick = async () => {
        await saveRating(q, parseInt(s.dataset.v));
        await renderStars(q);
      };

      s.onmouseover = () => {
        stars.forEach((ss, ii) => {
          ss.textContent = (ii <= i) ? '\u2605' : '\u2606';
          ss.classList.toggle('lit', ii <= i);
        });
      };

      s.onmouseleave = () => renderStars(q);
    });

    const avgEl = document.getElementById('avg-rating');
    if (data.count > 0) {
      avgEl.textContent = 'Moyenne : ' + data.avg.toFixed(1) + ' ★ (' + data.count + ' vote' + (data.count > 1 ? 's' : '') + ')';
    } else {
      avgEl.textContent = 'Pas encore noté';
    }
  }

  async function showQuestion(q) {
    document.getElementById('question-display').innerHTML = '<p><strong>' + q + '</strong></p>';
    await markQuestionAsked(q);

    try {
      await renderStars(q);
    } catch (e) {
      console.error("Erreur étoiles:", e);
    }

    showUI();
    if (previousQuestion) showBack();
    else hideBack();
  }

  function skipQuestion() {
    if (!currentTheme) return;
    if (currentQuestion) saveAskedQuestion(currentQuestion);
    getAvailableQuestion(currentQuestions).then(next => {
      if (!next) {
        document.getElementById('question-display').innerHTML = '<p><strong>⏳ Toutes les questions de ce thème ont été posées aujourd\'hui. Revenez demain !</strong></p>';
        hideUI();
        return;
      }
      previousQuestion = currentQuestion;
      currentQuestion = next;
      saveAskedQuestion(next);
      showQuestion(next);
    });
  }

  function goBack() {
    if (!previousQuestion) return;
    currentQuestion = previousQuestion;
    previousQuestion = null;
    showQuestion(currentQuestion);
  }

  spinBtn.onclick = function () {
    value += Math.ceil(Math.random() * 3600);
    wheel.style.transform = 'rotate(' + value + 'deg)';
    spinBtn.classList.add('blinking');
    wheel.classList.add('blinkaaa');
    hint.style.opacity = '0';
  };

  wheel.addEventListener('transitionend', async function () {
    const actualRotation = value % 360;
    const sectionIndex = Math.floor(actualRotation / 30) % 12;
    const themeList = ["Souvenirs", "Perception", "Avenir", "Amitiés", "Famille", "Amour", "Travail", "Malaises", "Croyances", "Conflits", "Expériences", "Loisirs"];
    const selectedSection = document.querySelector('.wheel .number:nth-child(' + (12 - sectionIndex + 1) + ')');
    const selectedTheme = themeList[parseInt(selectedSection.style.getPropertyValue('--i')) - 1];
    const selectedColor = getComputedStyle(selectedSection).getPropertyValue('--clr');

    document.body.style.background = shadeColor(selectedColor, -55);
    document.getElementById('selected-theme').textContent = selectedTheme;
    spinBtn.classList.remove('blinking');
    wheel.classList.remove('blinkaaa');

    currentTheme = selectedTheme;
    currentQuestions = themesQuestions[selectedTheme] || [];
    previousQuestion = null;

    const q = await weightedRandom(currentQuestions);
    if (!q) {
      document.getElementById('question-display').innerHTML = '<p><strong>⏳ Toutes les questions de ce thème ont déjà été posées aujourd\'hui. Revenez demain !</strong></p>';
      hideUI();
      return;
    }
    currentQuestion = q;
    saveAskedQuestion(q);
    showQuestion(q);
  });

  function shadeColor(hex, percent) {
    hex = hex.trim();
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, Math.min(255, r + percent));
    g = Math.max(0, Math.min(255, g + percent));
    b = Math.max(0, Math.min(255, b + percent));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  hideBack();
</script>
</body>
</html>
