<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel Questions</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <button class="spinBtn" type="button">spin</button>
    <div class="wheel">
      <div class="number" style="--i:1;--clr:#7fbeb4;"><span>Souvenirs</span></div>
      <div class="number" style="--i:2;--clr:#ffffb3;"><span>Perception</span></div>
      <div class="number" style="--i:3;--clr:#bebada;"><span>Avenir</span></div>
      <div class="number" style="--i:4;--clr:#fb8072;"><span>Amitiés</span></div>
      <div class="number" style="--i:5;--clr:#80b1d3;"><span>Famille</span></div>
      <div class="number" style="--i:6;--clr:#fdb462;"><span>Amour</span></div>
      <div class="number" style="--i:7;--clr:#b3de69;"><span>Travail</span></div>
      <div class="number" style="--i:8;--clr:#fccde5;"><span>Malaises</span></div>
      <div class="number" style="--i:9;--clr:#d9d9d9;"><span>Croyances</span></div>
      <div class="number" style="--i:10;--clr:#bc80bd;"><span>Conflits</span></div>
      <div class="number" style="--i:11;--clr:#ccebc5;"><span>Expériences</span></div>
      <div class="number" style="--i:12;--clr:#ffed6f;"><span>Loisirs</span></div>
    </div>
  </div>

  <div class="question-container">
    <h2>Thème: <span id="selected-theme">Aucun</span></h2>
    <p class="note-id">Note: <span id="note-id"></span></p>
    <div id="question-display">Chargement des questions...</div>
  </div>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script>
    // 1) Mets ta vraie config Firebase ici
    const firebaseConfig = {
      apiKey: "AIzaSyCVxw8U-DvB8YxQv09MlOcy8q5q9vlajDk",
      authDomain: "roue-des-questions.firebaseapp.com",
      projectId: "roue-des-questions",
      storageBucket: "roue-des-questions.firebasestorage.app",
      messagingSenderId: "297075017743",
      appId: "1:297075017743:web:0bf54c8d1252c027a8fb7a",
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const themes = [
      "Souvenirs", "Perception", "Avenir", "Amitiés", "Famille", "Amour",
      "Travail", "Malaises", "Croyances", "Conflits", "Expériences", "Loisirs"
    ];

    const noteQuestionsByTheme = {};
    const noteId = new URLSearchParams(window.location.search).get("noteId") || "default";

    const wheel = document.querySelector(".wheel");
    const spinBtn = document.querySelector(".spinBtn");
    const selectedThemeEl = document.getElementById("selected-theme");
    const questionDisplayEl = document.getElementById("question-display");
    document.getElementById("note-id").textContent = noteId;

    let value = Math.ceil(Math.random() * 3600);

    function getRandomQuestion(questions) {
      const randomIndex = Math.floor(Math.random() * questions.length);
      return questions[randomIndex];
    }

    async function ensureSignedIn() {
      if (auth.currentUser) return auth.currentUser;
      const credential = await auth.signInAnonymously();
      return credential.user;
    }

    async function loadQuestionsForNote(currentNoteId) {
      questionDisplayEl.textContent = "Chargement des questions...";
      Object.keys(noteQuestionsByTheme).forEach((k) => delete noteQuestionsByTheme[k]);

      await ensureSignedIn();

      const snapshot = await db
        .collection("notes")
        .doc(currentNoteId)
        .collection("questions")
        .get();

      snapshot.forEach((doc) => {
        const data = doc.data() || {};
        const theme = (data.theme || "").trim();
        const text = (data.text || "").trim();
        if (!theme || !text) return;

        if (!noteQuestionsByTheme[theme]) {
          noteQuestionsByTheme[theme] = [];
        }
        noteQuestionsByTheme[theme].push(text);
      });

      questionDisplayEl.textContent = "Clique sur spin pour commencer.";
    }

    function getSelectedThemeFromRotation(rotationValue) {
      const actualRotation = rotationValue % 360;
      const sectionIndex = Math.floor(actualRotation / 30) % 12;
      const selectedSection = document.querySelector(`.wheel .number:nth-child(${12 - sectionIndex + 1})`);
      const themeIndex = Number(selectedSection.style.getPropertyValue("--i")) - 1;
      return {
        theme: themes[themeIndex],
        color: getComputedStyle(selectedSection).getPropertyValue("--clr"),
      };
    }

    spinBtn.addEventListener("click", () => {
      value += Math.ceil(Math.random() * 3600);
      wheel.style.transform = `rotate(${value}deg)`;
      spinBtn.classList.add("blinking");
      wheel.classList.add("blinkaaa");
    });

    wheel.addEventListener("transitionend", () => {
      const { theme, color } = getSelectedThemeFromRotation(value);
      document.body.style.background = color;
      selectedThemeEl.textContent = theme;

      spinBtn.classList.remove("blinking");
      wheel.classList.remove("blinkaaa");

      const questions = noteQuestionsByTheme[theme] || [];
      if (!questions.length) {
        questionDisplayEl.innerHTML = `<p><strong>Aucune question pour le thème "${theme}" dans la note "${noteId}".</strong></p>`;
        return;
      }

      const randomQuestion = getRandomQuestion(questions);
      questionDisplayEl.innerHTML = `<p><strong>${randomQuestion}</strong></p>`;
    });

    (async function init() {
      try {
        await loadQuestionsForNote(noteId);
      } catch (error) {
        console.error(error);
        questionDisplayEl.innerHTML = `<p><strong>Erreur de chargement Firebase. Vérifie la config, l'auth anonyme et les règles Firestore.</strong></p>`;
      }
    })();
  </script>
</body>
</html>
