<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Roue des Questions</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

@keyframes blink {
    0%   { background-color: rgb(204,60,60); }
    50%  { background-color: #fff; }
    100% { background-color: rgb(204,60,60); }
}
@keyframes shadowBlink {
    0%   { box-shadow: 0 0 0 5px #333, 0 0 0 15px rgb(204,60,60), 0 0 0 18px #111; }
    50%  { box-shadow: 0 0 0 5px #333, 0 0 0 15px #fff,            0 0 0 18px #111; }
    100% { box-shadow: 0 0 0 5px #333, 0 0 0 15px rgb(204,60,60), 0 0 0 18px #111; }
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-width: 100vw;
    background: #2a2a2a;
    padding: 40px 20px;
    transition: background 0.6s ease;
}

.page-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    width: 100%;
    max-width: 620px;
}

.container {
    position: relative;
    --wheel-size: clamp(240px, 55vw, 420px);
    width: var(--wheel-size);
    height: var(--wheel-size);
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container .spinBtn {
    position: absolute;
    width: 56px; height: 56px;
    background: rgba(10,10,10,0.85);
    border-radius: 50%;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    text-transform: uppercase;
    font-weight: 700;
    font-size: 0.62em;
    color: #e0e0e0;
    letter-spacing: 0.08em;
    border: 3px solid rgba(255,255,255,0.12);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease;
}
.container .spinBtn:hover { transform: scale(1.09); }

.container .spinBtn::before {
    content: '';
    position: absolute;
    top: -26px;
    width: 18px; height: 32px;
    background: #fff;
    clip-path: polygon(50% 0, 0 100%, 100% 100%);
}

.blinking::before { animation: blink 0.5s infinite; }
.blinking         { animation: blink 0.5s infinite; }

.container .wheel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #333;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 5px #333,
                0 0 0 15px #fff,
                0 0 0 18px #111,
                0 8px 40px rgba(0,0,0,0.4);
    transition: transform 5s ease-in-out;
}

.blinkaaa { animation: shadowBlink 0.5s infinite; }

.container .wheel .number {
    position: absolute;
    width: 50%; height: 50%;
    background: var(--clr);
    transform-origin: bottom right;
    transform: rotate(calc(30deg * var(--i)));
    clip-path: polygon(0 0, 45% 0, 100% 100%, 0 39%);
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    cursor: pointer;
}

.container .wheel .number span {
    position: relative;
    transform: rotate(45deg);
    font-size: clamp(0.85em, 2.5vw, 1.4em);
    font-weight: 700;
    color: rgba(20,18,18,0.85);
    text-shadow: 1px 1px 2px rgba(255,255,255,0.35);
    white-space: nowrap;
}

.question-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
}

.theme-label {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.35);
}

#selected-theme {
    display: block;
    font-size: clamp(2.8rem, 7vw, 4.2rem);
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -0.02em;
}

.divider {
    width: 44px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
}

#question-display {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    line-height: 1.75;
    color: rgba(255,255,255,0.82);
    max-width: 520px;
}
#question-display p      { animation: fadeInUp 0.4s ease; }
#question-display strong { font-weight: 600; color: #fff; }

.hint {
    font-size: 1rem;
    color: rgba(255,255,255,0.22);
    font-style: italic;
}

/* Notation */
#rating-container {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: fadeInUp 0.4s ease;
}
#rating-container.visible { display: flex; }

.rating-label {
    font-size: 0.82rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.35);
}

#stars { display: flex; gap: 6px; }

.star {
    font-size: clamp(1.6rem, 5vw, 2rem);
    color: rgba(255,255,255,0.25);
    cursor: pointer;
    transition: color 0.15s ease, transform 0.15s ease;
    line-height: 1;
    user-select: none;
}
.star:hover { color: #ffd966; transform: scale(1.18); }
.star.lit   { color: #ffd966; }

#avg-rating {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.38);
    font-style: italic;
    min-height: 1.2em;
}

/* Nav buttons */
#nav-buttons {
    display: none;
    flex-direction: row;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeInUp 0.4s ease;
}
#nav-buttons.visible { display: flex; }

#nav-buttons button {
    padding: 9px 22px;
    border-radius: 24px;
    border: 2px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    font-family: 'Poppins', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease,
                border-color 0.2s ease, transform 0.15s ease;
    backdrop-filter: blur(4px);
}
#nav-buttons button:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.4);
    color: #fff;
    transform: translateY(-2px);
}
#nav-buttons button:active { transform: translateY(0); }

#btn-back.hidden {
    opacity: 0;
    pointer-events: none;
}
    </style>
</head>
<body>
    <div class="page-wrapper">

        <!-- Roue -->
        <div class="container">
            <div class="spinBtn">spin</div>
            <div class="wheel">
                <div class="number" style="--i:1;--clr:#7fbeb4;"><span>Souvenirs</span></div>
                <div class="number" style="--i:2;--clr:#ffffb3;"><span>Perception</span></div>
                <div class="number" style="--i:3;--clr:#bebada;"><span>Avenir</span></div>
                <div class="number" style="--i:4;--clr:#fb8072;"><span>Amitiés</span></div>
                <div class="number" style="--i:5;--clr:#80b1d3;"><span>Famille</span></div>
                <div class="number" style="--i:6;--clr:#fdb462;"><span>Amour</span></div>
                <div class="number" style="--i:7;--clr:#b3de69;"><span>Travail</span></div>
                <div class="number" style="--i:8;--clr:#fccde5;"><span>Malaises</span></div>
                <div class="number" style="--i:9;--clr:#d9d9d9;"><span>Croyances</span></div>
                <div class="number" style="--i:10;--clr:#bc80bd;"><span>Conflits</span></div>
                <div class="number" style="--i:11;--clr:#ccebc5;"><span>Expériences</span></div>
                <div class="number" style="--i:12;--clr:#ffed6f;"><span>Loisirs</span></div>
            </div>
        </div>

        <!-- Question -->
        <div class="question-container">
            <span class="theme-label">Thème</span>
            <span id="selected-theme">—</span>
            <div class="divider"></div>
            <div id="question-display">
                <p><strong>Faites tourner la roue pour découvrir une question.</strong></p>
            </div>

            <!-- Notation par étoiles -->
            <div id="rating-container">
                <span class="rating-label">Noter cette question :</span>
                <div id="stars">
                    <span class="star" data-v="1">&#9734;</span>
                    <span class="star" data-v="2">&#9734;</span>
                    <span class="star" data-v="3">&#9734;</span>
                    <span class="star" data-v="4">&#9734;</span>
                    <span class="star" data-v="5">&#9734;</span>
                </div>
                <div id="avg-rating"></div>
            </div>

            <!-- Boutons Skip / Retour -->
            <div id="nav-buttons">
                <button id="btn-back" onclick="goBack()">&#8592; Précédente</button>
                <button id="btn-skip" onclick="skipQuestion()">Passer &#8594;</button>
            </div>

            <p class="hint">Appuyez sur SPIN pour commencer</p>
        </div>

    </div>

<script>
  // Configuration Firestore REST API
  const firebaseConfig = {
    apiKey: "AIzaSyCVxw8U-DvB8YxQv09MlOcy8q5q9vlajDk",
    projectId: "roue-des-questions"
  };

  const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;
  const API_KEY = firebaseConfig.apiKey;


  const themesQuestions = {
    "Souvenirs": [
      "Quel est ton premier souvenirs ?",
      "Est ce que tu étais boloss ou est ce que tu bolossais au collèges ?",
      "En quatre minutes, racontez votre vie de la façon la plus détaillée possible.",
      "Quel est le souvenir le plus embarrassant de ton enfance ?",
      "Quel moment de ta vie aimerais-tu revivre ?"
    ],
    "Perception": [
      "Est ce que tu aimes bien ton visage",
      "Est ce que tu aimes bien ton nom",
      "Si vous pouviez vous réveiller demain matin avec une qualité ou une capacité de plus, que serait-ce ?",
      "Comment les autres te perçoivent-ils selon toi ?",
      "Qu'est-ce que tu aimes le plus chez toi ?"
    ],
    "Avenir": [
      "Si une boule de cristal pouvait vous dire la vérité sur votre avenir, que voudriez-vous savoir ?",
      "Y a-t-il quelque chose que vous avez rêvé de faire depuis longtemps ? Pourquoi ne l'as-tu pas encore fait ?",
      "Où te vois-tu dans 5 ans ?",
      "Quel est ton plus grand rêve ?",
      "Qu'est-ce que tu veux accomplir avant de mourir ?"
    ],
    "Amitiés": [
      "Qu'est-ce que vous appréciez le plus dans une amitié ?",
      "Que signifie l'amitié pour vous ?",
      "Quelle est la chose la plus gentille que vous vous souvenez avoir faite pour une amie ?",
      "As-tu un ami qui te comprend sans parler ?",
      "Quel est le sacrifice le plus grand que tu as fait pour un ami ?"
    ],
    "Famille": [
      "Quel est votre surnom de famille le plus embarrassant ?",
      "Quelle est la tradition familiale que vous chérissez le plus ?",
      "Quel membre de ta famille te ressemble le plus ?",
      "Quel est le conseil que tes parents t'ont donné qui t'a le plus aidé ?",
      "Qu'est-ce que tu aimerais que ta famille sache sur toi ?"
    ],
    "Amour": [
      "Quelle est la chose la plus romantique que quelqu'un ait faite pour toi ?",
      "Quel est ton love language ?",
      "As-tu déjà été amoureux sans le dire ?",
      "Quelle qualité cherches-tu chez un partenaire ?",
      "Crois-tu au coup de foudre ?"
    ],
    "Travail": [
      "Quel est ton pire souvenir au travail ?",
      "Si tu pouvais changer de métier demain, tu ferais quoi ?",
      "Qu'est-ce qui te motive vraiment dans ton travail ?",
      "As-tu déjà quitté un emploi sans préavis ?",
      "Qu'est-ce que tu aimes le plus dans ton job ?"
    ],
    "Malaises": [
      "Quelle est la situation la plus gênante que tu aies vécue ?",
      "As-tu déjà envoyé un message à la mauvaise personne ?",
      "Quel est le mensonge dont tu as le plus honte ?",
      "Y a-t-il quelque chose de toi que peu de gens savent ?",
      "Quel est ton plus gros défaut ?"
    ],
    "Croyances": [
      "Crois-tu en la vie après la mort ?",
      "Quelle est ta superstition la plus irrationnelle ?",
      "As-tu déjà eu un signe qui t'a semblé venir d'ailleurs ?",
      "En quoi crois-tu vraiment ?",
      "Quel est ton rapport à la spiritualité ?"
    ],
    "Conflits": [
      "Quelle est la dispute dont tu es le plus fier d'être sorti ?",
      "As-tu déjà coupé les ponts avec quelqu'un ? Pourquoi ?",
      "Comment réagis-tu quand quelqu'un te blesse ?",
      "Quel conflit non résolu te pèse encore ?",
      "Comment tu gères tes conflits généralement ?"
    ],
    "Expériences": [
      "Si tu pouvais voyager dans le temps pour assister à UN événement passé, ce serait quoi ?",
      "Quel est l'endroit où tu t'es senti le plus à l'aise et détendu ?",
      "Quel est l'expérience la plus folle que tu as vécue ?",
      "Y a-t-il quelque chose dont tu es fier d'avoir surmonté ?",
      "Quel voyage t'a le plus marqué ?"
    ],
    "Loisirs": [
      "Qu'est-ce qui constituerait une journée parfaite pour vous ?",
      "C'est quoi ton gros mot préféré ?",
      "Qu'est-ce que vous regardez/écoutez/lisez en boucle ces derniers temps ?",
      "Quelle est ton activité préférée pour te détendre ?",
      "Quel hobby secret aimerais-tu développer ?"
    ]
  };
  const wheel = document.querySelector('.wheel');
  const spinBtn = document.querySelector('.spinBtn');
  const hint = document.querySelector('.hint');
  let value = Math.ceil(Math.random() * 3600);

  let currentTheme = null;
  let currentQuestions = [];
  let currentQuestion = null;
  let previousQuestion = null;

  const ratingEl = document.getElementById('rating-container');
  const navEl = document.getElementById('nav-buttons');
  const btnBack = document.getElementById('btn-back');

  function showUI() { 
    ratingEl.classList.add('visible'); 
    navEl.classList.add('visible'); 
  }

  function hideUI() { 
    ratingEl.classList.remove('visible'); 
    navEl.classList.remove('visible'); 
  }

  function showBack() { 
    btnBack.classList.remove('hidden'); 
  }

  function hideBack() { 
    btnBack.classList.add('hidden'); 
  }

  function getTodayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function getAskedQuestions() {
    const todayKey = getTodayKey();
    const stored = JSON.parse(localStorage.getItem('askedQuestions') || '{}');
    if (stored.date !== todayKey) return { date: todayKey, questions: [] };
    return stored;
  }

  function saveAskedQuestion(q) {
    const data = getAskedQuestions();
    if (!data.questions.includes(q)) data.questions.push(q);
    localStorage.setItem('askedQuestions', JSON.stringify(data));
  }

  // Firestore REST API functions
  async function saveRating(q, note) {
    try {
      const docId = btoa(q);
      const url = `${FIRESTORE_URL}/questions/${docId}?key=${API_KEY}`;
      
      const response = await fetch(url);
      const data = response.ok ? await response.json() : null;
      
      const fields = data?.fields || { sum: { integerValue: "0" }, count: { integerValue: "0" } };
      const sum = parseInt(fields.sum?.integerValue || 0) + note;
      const count = parseInt(fields.count?.integerValue || 0) + 1;

      await fetch(url, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fields: {
            sum: { integerValue: sum.toString() },
            count: { integerValue: count.toString() }
          }
        })
      });
         } catch (e) {
      console.error("Erreur sauvegarde:", e);
    }
  }

  async function getQuestionData(q) {
    try {
      const docId = btoa(q);
      const url = `${FIRESTORE_URL}/questions/${docId}?key=${API_KEY}`;
      const response = await fetch(url);
      
      if (!response.ok) return { avg: 3, count: 0, asked: 0 };
      
      const data = await response.json();
      const sum = parseInt(data.fields?.sum?.integerValue || 0);
      const count = parseInt(data.fields?.count?.integerValue || 0);
      const asked = parseInt(data.fields?.asked?.integerValue || 0);
        
      return {
        avg: count > 0 ? sum / count : 3,
        count: count,
        asked: asked
      };
    } catch (e) {
      console.error("Erreur lecture:", e);
      return { avg: 3, count: 0, asked: 0 };
    }
  }

  async function markQuestionAsked(q) {
    try {
      const docId = btoa(q);
      const url = `${FIRESTORE_URL}/questions/${docId}?key=${API_KEY}`;
      
      const response = await fetch(url);
      const data = response.ok ? await response.json() : null;
      const asked = parseInt(data?.fields?.asked?.integerValue || 0) + 1;

      await fetch(url, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fields: {
            asked: { integerValue: asked.toString() }
          }
        })
      });
    } catch (e) {
      console.error("Erreur marquage:", e);
    }
  }

  async function weightedRandom(questions) {
    let weights = [];

    for (let q of questions) {
      const data = await getQuestionData(q);
      const avg = data.avg;
      const count = data.count;
      const asked = data.asked;

      const popularity = Math.log(1 + count);
      const freshness = 1 / (1 + asked);
      const weight = Math.max(0.3, avg * (1 + popularity) * (1 + freshness));

      weights.push(weight);
    }

    const total = weights.reduce((a, b) => a + b, 0);
    let rand = Math.random() * total;

    for (let i = 0; i < questions.length; i++) {
      rand -= weights[i];
      if (rand <= 0) return questions[i];
    }

    return questions[questions.length - 1];
  }

  async function getAvailableQuestion(questions) {
    const asked = getAskedQuestions().questions;
    const available = questions.filter(q => !asked.includes(q));
    if (available.length === 0) return null;
    return await weightedRandom(available);
  }

  async function renderStars(q) {
    const data = await getQuestionData(q);
    const avg = data.avg;
    const stars = document.querySelectorAll('.star');
    const filled = (avg !== null && avg !== undefined) ? Math.round(avg) : 0;

    stars.forEach((s, i) => {
      s.textContent = (i < filled) ? '\u2605' : '\u2606';
      s.classList.toggle('lit', i < filled);

      s.onclick = async () => {
        await saveRating(q, parseInt(s.dataset.v));
        await renderStars(q);
      };

      s.onmouseover = () => {
        stars.forEach((ss, ii) => {
          ss.textContent = (ii <= i) ? '\u2605' : '\u2606';
          ss.classList.toggle('lit', ii <= i);
        });
      };

      s.onmouseleave = () => renderStars(q);
    });

    const avgEl = document.getElementById('avg-rating');
    if (data.count > 0) {
      avgEl.textContent = 'Moyenne : ' + data.avg.toFixed(1) + ' ★ (' + data.count + ' vote' + (data.count > 1 ? 's' : '') + ')';
    } else {
      avgEl.textContent = 'Pas encore noté';
    }
  }

  async function showQuestion(q) {
    document.getElementById('question-display').innerHTML = '<p><strong>' + q + '</strong></p>';
    await markQuestionAsked(q);

    try {
      await renderStars(q);
    } catch (e) {
      console.error("Erreur étoiles:", e);
    }

    showUI();
    if (previousQuestion) showBack();
    else hideBack();
  }

  function skipQuestion() {
    if (!currentTheme) return;
    if (currentQuestion) saveAskedQuestion(currentQuestion);
    getAvailableQuestion(currentQuestions).then(next => {
      if (!next) {
        document.getElementById('question-display').innerHTML = '<p><strong>⏳ Toutes les questions de ce thème ont été posées aujourd\'hui. Revenez demain !</strong></p>';
        hideUI();
        return;
      }
      previousQuestion = currentQuestion;
      currentQuestion = next;
      saveAskedQuestion(next);
      showQuestion(next);
    });
  }

  function goBack() {
    if (!previousQuestion) return;
    currentQuestion = previousQuestion;
    previousQuestion = null;
    showQuestion(currentQuestion);
  }

  spinBtn.onclick = function () {
    value += Math.ceil(Math.random() * 3600);
    wheel.style.transform = 'rotate(' + value + 'deg)';
    spinBtn.classList.add('blinking');
    wheel.classList.add('blinkaaa');
    hint.style.opacity = '0';
  };

  wheel.addEventListener('transitionend', async function () {
    const actualRotation = value % 360;
    const sectionIndex = Math.floor(actualRotation / 30) % 12;
    const themeList = ["Souvenirs", "Perception", "Avenir", "Amitiés", "Famille", "Amour", "Travail", "Malaises", "Croyances", "Conflits", "Expériences", "Loisirs"];
    const selectedSection = document.querySelector('.wheel .number:nth-child(' + (12 - sectionIndex + 1) + ')');
    const selectedTheme = themeList[parseInt(selectedSection.style.getPropertyValue('--i')) - 1];
    const selectedColor = getComputedStyle(selectedSection).getPropertyValue('--clr');

    document.body.style.background = shadeColor(selectedColor, -55);
    document.getElementById('selected-theme').textContent = selectedTheme;
    spinBtn.classList.remove('blinking');
    wheel.classList.remove('blinkaaa');

    currentTheme = selectedTheme;
    currentQuestions = themesQuestions[selectedTheme] || [];
    previousQuestion = null;

    const q = await weightedRandom(currentQuestions);
    if (!q) {
      document.getElementById('question-display').innerHTML = '<p><strong>⏳ Toutes les questions de ce thème ont déjà été posées aujourd\'hui. Revenez demain !</strong></p>';
      hideUI();
      return;
    }
    currentQuestion = q;
    saveAskedQuestion(q);
    showQuestion(q);
  });

  function shadeColor(hex, percent) {
    hex = hex.trim();
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, Math.min(255, r + percent));
    g = Math.max(0, Math.min(255, g + percent));
    b = Math.max(0, Math.min(255, b + percent));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  hideBack();
</script>
</body>
</html>
