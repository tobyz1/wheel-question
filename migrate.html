    function log(msg, cls = '') {
      const el = document.getElementById('log');
      el.innerHTML += '<span class="' + cls + '">' + msg + '</span>\n';
      el.scrollTop = el.scrollHeight;
    }

    async function startMigration() {
      const btn = document.getElementById('start-btn');
      btn.disabled = true;
      document.getElementById('log').innerHTML = '';

      log('Connexion Google admin...', 'info');
try {
  const provider = new firebase.auth.GoogleAuthProvider();
  await auth.signInWithPopup(provider);
  log('Connecte en tant que : ' + auth.currentUser.email + '\n', 'ok');
} catch (e) {
  log('Erreur connexion : ' + e.message, 'err');
  btn.disabled = false;
  return;
}

      let total = 0, skipped = 0, written = 0, errors = 0;

      for (const [theme, questions] of Object.entries(themesQuestions)) {
        log('\nTheme : ' + theme + ' (' + questions.length + ' questions)', 'info');

        let existingTexts = new Set();
        try {
          const snap = await db.collection('questions').doc(theme).collection('items').get();
          snap.forEach(d => existingTexts.add(d.data().text));
          log('   ' + existingTexts.size + ' questions deja presentes', '');
        } catch (e) {
          log('   Impossible de lire les existantes : ' + e.message, 'err');
        }

        const uniqueQuestions = [...new Set(questions)];

        for (const text of uniqueQuestions) {
          total++;
          if (existingTexts.has(text)) {
            skipped++;
            continue;
          }
          try {
            await db.collection('questions').doc(theme).collection('items').add({
              text:      text,
              theme:     theme,
              source:    'local',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            existingTexts.add(text);
            written++;
            log('   OK : ' + text.substring(0, 70), 'ok');
          } catch (e) {
            errors++;
            log('   ERREUR : ' + e.message, 'err');
          }
        }
      }

      log('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
      log('Migration terminee !', 'ok');
      log('   Total traites : ' + total, '');
      log('   Ecrits        : ' + written, 'ok');
      log('   Ignores (deja presents) : ' + skipped, '');
      log('   Erreurs       : ' + errors, errors > 0 ? 'err' : '');

      btn.disabled = false;
    }
  </script>
